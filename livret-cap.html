<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#14211F"><style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Livret PFMP CAP MI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Concept : un seul écran à la fois, une barre « mètre ruban » qui avance chaque jour rempli, navigation fixe en bas au pouce. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --ink:#14211F; --muted:#586662; --line:#D3DBD8;
  --tape:#F2B705; --tape-ink:#3A2E00; --tick:#8A6F00;
  --sel:#DCEBFA; --sel-line:#1D4E89; --link:#1D4E89;
  --primary:#14211F; --on-primary:#FFFFFF; --warn:#FFF1C7; --ok:#1E7A4C;
  --font-display:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
  --gutter:max(16px,env(safe-area-inset-left,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1716; --surface:#172221; --ink:#E8EFED; --muted:#9BAAA6; --line:#2B3B38;
  --tape:#F2B705; --tape-ink:#2A2100; --tick:#5C4A00;
  --sel:#1C3350; --sel-line:#7FB0EE; --link:#8DB8F0;
  --primary:#E8EFED; --on-primary:#0F1716; --warn:#3A3000; --ok:#5FCB92; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1716; --surface:#172221; --ink:#E8EFED; --muted:#9BAAA6; --line:#2B3B38;
  --tape:#F2B705; --tape-ink:#2A2100; --tick:#5C4A00;
  --sel:#1C3350; --sel-line:#7FB0EE; --link:#8DB8F0;
  --primary:#E8EFED; --on-primary:#0F1716; --warn:#3A3000; --ok:#5FCB92; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.2}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sel-line);outline-offset:2px}

.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.hdr-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.hdr h1{font-size:1.1rem}
.hdr small{color:var(--muted);font-size:.85rem;white-space:nowrap}
.tape{position:relative;height:22px;margin-top:8px;border-radius:3px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.tape-fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--tape);transition:width .4s}
.tape-ticks{position:absolute;inset:0;background:
  repeating-linear-gradient(90deg,var(--tick) 0 1px,transparent 1px 40px) bottom/100% 14px no-repeat,
  repeating-linear-gradient(90deg,var(--tick) 0 1px,transparent 1px 8px) bottom/100% 7px no-repeat}
.tape-txt{position:absolute;left:8px;top:1px;font-size:.75rem;font-weight:600;color:var(--tape-ink);mix-blend-mode:normal;text-shadow:0 0 3px var(--tape)}

main{display:flex;flex-direction:column;gap:16px;padding-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.lead{color:var(--muted);font-size:.95rem}
.nudge{border-radius:10px;padding:12px 14px;background:var(--warn);font-weight:600}
.nudge.done{background:var(--sel);color:var(--ink)}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span,.lbl{font-size:.85rem;font-weight:600;color:var(--muted)}
.f input,.f textarea,.f select{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);min-height:44px}
.f textarea{resize:vertical;min-height:84px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:44px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sel);border-color:var(--sel-line);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 8px;min-height:48px;cursor:pointer;text-align:center}
.seg button[aria-pressed="true"]{background:var(--sel);border-color:var(--sel-line);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 18px;min-height:48px;background:var(--primary);color:var(--on-primary);font-weight:600;cursor:pointer;text-align:center}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{min-height:40px;padding:8px 12px;font-size:.9rem}
.btn.danger{color:var(--ink)}
.btn.armed{background:var(--tape);color:var(--tape-ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.entry{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.entry:first-of-type{border-top:0;padding-top:0}
.entry b{font-family:var(--font-display)}
.muted{color:var(--muted);font-size:.9rem}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ph{display:flex;flex-direction:column;gap:6px;min-width:0}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.ph .f textarea{min-height:56px}
details summary{cursor:pointer;font-weight:600;min-height:32px}
.urg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.urg a{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px;text-decoration:none;color:var(--ink);background:var(--bg)}
.urg strong{font-family:var(--font-display);font-size:1.4rem}
.urg span{font-size:.8rem;color:var(--muted)}
ul.rules{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:6px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52px;border-radius:10px;text-decoration:none;color:var(--muted);font-size:.78rem;font-weight:600;gap:2px}
.nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"]{color:var(--ink);background:var(--sel)}
#toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--primary);color:var(--on-primary);padding:10px 16px;border-radius:10px;z-index:20;max-width:90vw;font-weight:600}

.sheet{display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:1.15rem}
.sheet h3{font-size:1rem;border-bottom:2px solid var(--tape);padding-bottom:2px;margin-top:6px}
.tw{overflow-x:auto}
.sheet table{border-collapse:collapse;width:100%;font-size:.88rem}
.sheet th,.sheet td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.sheet th{background:var(--bg)}
.blank{height:56px}
.sign{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.sign div{border:1px solid var(--line);min-height:90px;padding:6px;font-size:.8rem}
.sheet textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)}
.sigbox{display:flex;flex-direction:column;gap:8px;min-width:0}
/* La zone de signature est une feuille blanche, quel que soit le thème */
canvas.pad{display:block;width:100%;height:170px;background:#FFFFFF;border:2px dashed var(--line);border-radius:10px;touch-action:none}
.sigimg{width:100%;max-width:340px;background:#FFFFFF;border:1px solid var(--line);border-radius:8px}
.sign img{display:block;width:100%;background:#FFFFFF}

@media print{
  .hdr,.nav,.noprint,#toast,body::before{display:none!important}
  :root{padding:0!important}
  body{background:#fff;color:#000;padding:0}
  .card{border:0;padding:0;background:#fff}
  .sheet{--ink:#000;--line:#444;--muted:#222;--surface:#fff;--bg:#fff;--tape:#000;color:#000}
  .sheet tr,.ph,.sign div{break-inside:avoid}
  .sheet h3{break-after:avoid}
}
@media (prefers-reduced-motion:reduce){.tape-fill{transition:none}}
</style>

<div class="app">
  <header class="hdr">
    <div class="hdr-top"><h1>Livret PFMP · CAP MI</h1><small id="who"></small></div>
    <div class="tape" role="img" aria-label="Avancement du livret"><div class="tape-fill" id="tapeFill"></div><div class="tape-ticks"></div><div class="tape-txt" id="tapeTxt"></div></div>
  </header>
  <main id="view"></main>
</div>
<nav class="nav" aria-label="Navigation">
  <a href="#infos" data-r="infos"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/></svg>Infos</a>
  <a href="#journee" data-r="journee"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Journée</a>
  <a href="#photos" data-r="photos"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>Photos</a>
  <a href="#bilans" data-r="bilans"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Bilans</a>
  <a href="#pdf" data-r="pdf"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 13h5M10 17h5"/></svg>PDF</a>
</nav>
<div id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script>
(function(){
'use strict';
var KEY='pfmp-cap-mi-v1', S, draft=null, wk=1, mode='sem', memOnly=false, tmr=null, toastT=null, pdfBlob=null, pdfBusy=false;

var ACTS=[['📖','Lire un plan'],['📏','Mesurer'],['✏️','Tracer'],['🪚','Débiter'],['⚙️','Usiner'],['🔩','Assembler en atelier'],['🏠','Poser sur chantier'],['🔧','Régler, ajuster'],['🧽','Poncer, finir'],['🚚','Charger, livrer'],['🧹','Ranger, nettoyer']];
var MACH=['Scie à format','Toupie','Défonceuse','Perceuse','Visseuse','Domino','Scie sauteuse','Niveau laser','Ponceuse','Cloueur'];
var TASKS=['Lire un plan et une fiche de débit','Préparer et débiter les panneaux ou le bois','Usiner (toupie, scie, défonceuse, perceuse)','Assembler en atelier','Poser sur chantier (fenêtres, portes, aménagements)','Régler et ajuster (quincaillerie, jeux, étanchéité)','Poncer, finir, protéger','Ranger, nettoyer, respecter la sécurité','Communiquer avec l\'équipe'];
var LV={a:'😃 Autonome',h:'🤝 Avec aide',o:'👀 Observé',n:'🚫 Pas fait'};
var MOOD={tb:'😀 Très bien',b:'🙂 Bien',m:'😐 Moyen',d:'😟 Difficile'};
var PRIDE={tf:'😀 Très fier',c:'🙂 Content',m:'😐 Moyen'};
var AGAIN={oui:'👍 Oui',non:'👎 Non',pe:'🤔 Peut-être'};
var ROUTES=['infos','journee','photos','bilans','pdf'];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fdate(iso){if(!iso)return '';var d=new Date(iso+'T12:00:00');return isNaN(d)?iso:d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}
function sdate(iso){if(!iso)return '';var d=new Date(iso+'T12:00:00');return isNaN(d)?iso:d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}

function load(){
  try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
  if(!S||typeof S!=='object')S={};
  S.info=S.info||{};S.days=S.days||[];S.photos=S.photos||[];S.weeks=S.weeks||{};S.real=S.real||{};
  S.fin=S.fin||{};S.fin.tasks=S.fin.tasks||{};S.fin.avis=S.fin.avis||{};S.fin.tut=S.fin.tut||{};S.sig=S.sig||{};
}
function save(){
  pdfBlob=null;
  try{localStorage.setItem(KEY,JSON.stringify(S));return true}
  catch(e){if(!memOnly){memOnly=true;toast('Le téléphone refuse d\'enregistrer (mémoire pleine ou navigation privée). Exporte le PDF avant de fermer.')}return false}
}
function saveSoon(){clearTimeout(tmr);tmr=setTimeout(function(){save();tape()},400)}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},3200)}

function ctx(){return {info:S.info,weeks:S.weeks,fin:S.fin,real:S.real,photos:S.photos,draft:draft,sig:S.sig}}
function get(p){var o=ctx(),k=p.split('.');for(var i=0;i<k.length;i++){if(o==null)return undefined;o=o[k[i]]}return o}
function set(p,v){var o=ctx(),k=p.split('.');for(var i=0;i<k.length-1;i++){if(o[k[i]]==null)o[k[i]]={};o=o[k[i]]}o[k[k.length-1]]=v}

function inp(p,label,type,ph){return '<label class="f"><span>'+esc(label)+'</span><input data-p="'+p+'" type="'+(type||'text')+'" value="'+esc(get(p)||'')+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+(type==='number'?' inputmode="numeric" min="1" max="12"':'')+'></label>'}
function ta(p,label,rows,ph){return '<label class="f"><span>'+esc(label)+'</span><textarea data-p="'+p+'" rows="'+(rows||3)+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>'+esc(get(p)||'')+'</textarea></label>'}
function seg(p,map){var cur=get(p),h='<div class="seg" role="group">';Object.keys(map).forEach(function(k){h+='<button type="button" data-radio="'+p+'" data-v="'+k+'" aria-pressed="'+(cur===k)+'">'+esc(map[k])+'</button>'});return h+'</div>'}
function chips(p,list){var cur=get(p)||[];return '<div class="chips">'+list.map(function(it){var v=Array.isArray(it)?it[1]:it,l=Array.isArray(it)?it[0]+' '+it[1]:it;return '<button type="button" class="chip" data-chip="'+p+'" data-v="'+esc(v)+'" aria-pressed="'+(cur.indexOf(v)>-1)+'">'+esc(l)+'</button>'}).join('')+'</div>'}
function photoBtn(label,cls){return '<label class="btn '+(cls||'')+'"><input type="file" accept="image/*" multiple hidden data-photo>'+label+'</label>'}

function weeksCount(){var n=parseInt(S.info.semaines,10);return n>0&&n<=12?n:3}
function filledDays(){return S.days.filter(function(d){return (d.acts&&d.acts.length)||d.text}).length}
function photoNums(ids){return (ids||[]).map(function(id){for(var i=0;i<S.photos.length;i++)if(S.photos[i].id===id)return i+1;return null}).filter(Boolean)}

function draftFor(date){
  for(var i=0;i<S.days.length;i++)if(S.days[i].date===date)return JSON.parse(JSON.stringify(S.days[i]));
  return {id:date,date:date,acts:[],machines:[],autre:'',text:'',level:'',photos:[]};
}

/* ---------- vues ---------- */
function vInfos(){
  var h='';
  h+='<section class="card"><h2>Mes informations</h2><p class="lead">À remplir une seule fois, au début de la PFMP.</p>'
   +inp('info.nom','Nom et prénom')
   +'<div class="grid2">'+inp('info.classe','Classe',null,'CAP MI 2ème année')+inp('info.lycee','Lycée')+'</div>'
   +'<div class="grid2">'+inp('info.prof','Professeur référent')+inp('info.tellycee','Téléphone du lycée','tel')+'</div></section>';
  h+='<section class="card"><h2>Mon entreprise</h2>'
   +inp('info.ent','Nom de l\'entreprise')+inp('info.adr','Adresse')+inp('info.tel','Téléphone de l\'entreprise','tel')
   +'<div class="grid2">'+inp('info.tuteur','Nom du tuteur')+inp('info.tuteurtel','Téléphone du tuteur','tel')+'</div>'
   +inp('info.metier','Métier du tuteur')+inp('info.horaires','Horaires de travail')
   +'<div class="grid2">'+inp('info.du','Du','date')+inp('info.au','Au','date')+'</div>'
   +inp('info.semaines','Nombre de semaines','number','3')+'</section>';
  h+='<section class="card"><h2>Urgences et contacts</h2><div class="urg">'
   +'<a href="tel:15"><strong>15</strong><span>SAMU</span></a><a href="tel:18"><strong>18</strong><span>Pompiers</span></a><a href="tel:112"><strong>112</strong><span>Européen</span></a></div>'
   +'<div class="grid2">'+inp('info.urgnom','Personne à prévenir')+inp('info.urgtel','Son téléphone','tel')+'</div></section>';
  h+='<section class="card"><h2>Sécurité</h2><ul class="rules">'
   +'<li>Je porte mes EPI : chaussures de sécurité, lunettes, casque antibruit, masque à poussière, gants selon la tâche.</li>'
   +'<li>Je n\'utilise une machine que si mon tuteur m\'y a autorisé et formé.</li>'
   +'<li>Si je ne comprends pas ou si j\'ai un doute, je demande avant de faire.</li>'
   +'<li>Si je suis absent ou en retard, je préviens le tuteur et le lycée le matin même.</li></ul></section>';
  h+='<section class="card"><details><summary>Je découvre mon entreprise (jour 1)</summary><div style="display:flex;flex-direction:column;gap:14px;margin-top:12px">'
   +ta('info.j1fait','Ce que fait l\'entreprise (fenêtres, cuisines, escaliers, agencement…)',2)
   +inp('info.j1pers','Nombre de personnes qui y travaillent')
   +ta('info.j1mach','Les machines que je vois à l\'atelier',2)
   +ta('info.j1chant','Les chantiers ou les commandes en cours',2)
   +ta('info.j1regles','Les règles à retenir (horaires, pauses, rangement)',2)
   +'</div></details></section>';
  return h;
}

function vJournee(){
  if(!draft)draft=draftFor(todayISO());
  var t=todayISO(),done=S.days.some(function(d){return d.date===t&&((d.acts&&d.acts.length)||d.text)});
  var h=done?'<div class="nudge done">Aujourd\'hui est rempli. Bravo.</div>':'<div class="nudge">Aujourd\'hui, tu n\'as pas encore rempli ta journée. Ça prend 2 minutes.</div>';
  var nums=photoNums(draft.photos);
  h+='<section class="card"><h2>Ma journée</h2>'
   +inp('draft.date','Date','date')
   +'<div class="f"><span>Ce que j\'ai fait (touche les activités)</span>'+chips('draft.acts',ACTS)+'</div>'
   +'<div class="f"><span>Machines et outils utilisés</span>'+chips('draft.machines',MACH)+'</div>'
   +inp('draft.autre','Autre machine, outil ou matériau','text','panneau mélaminé, joint, cales…')
   +ta('draft.text','Je décris en 2 ou 3 phrases (j\'ai tracé, j\'ai monté, j\'ai posé…)',4,'Tu peux dicter avec le micro de ton clavier.')
   +'<div class="f"><span>Mon niveau</span>'+seg('draft.level',{a:LV.a,h:LV.h,o:LV.o})+'</div>'
   +'<div class="f"><span>Ma photo du jour'+(nums.length?' (photo n° '+nums.join(', ')+')':'')+'</span>'
   +(draft.photos.length?'<div class="photos">'+draft.photos.map(function(id){var p=S.photos.filter(function(x){return x.id===id})[0];return p?'<div class="ph"><img alt="Photo du jour" src="'+p.data+'"></div>':''}).join('')+'</div>':'')
   +'<div class="row">'+photoBtn('Ajouter une photo','alt')+'</div>'
   +'<p class="muted">Avec l\'accord du tuteur, sans visage ni plan du client.</p></div>'
   +'<button type="button" class="btn" data-act="save-day">Enregistrer ma journée</button></section>';
  var list=S.days.slice().sort(function(a,b){return a.date<b.date?1:-1});
  h+='<section class="card"><h2>Mes journées</h2>'+(list.length?'':'<p class="lead">Rien d\'enregistré pour l\'instant.</p>');
  list.forEach(function(d){
    var n=photoNums(d.photos);
    h+='<div class="entry"><b>'+esc(fdate(d.date))+'</b>'
     +'<div>'+esc((d.acts||[]).join(', '))+'</div>'

function initPad(cv){
  var r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
  cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));
  var g=cv.getContext('2d');g.scale(dpr,dpr);g.lineWidth=2.4;g.lineCap='round';g.lineJoin='round';g.strokeStyle='#111111';g.fillStyle='#111111';
  var down=false,lx=0,ly=0;cv._dirty=false;
  function pt(e){var b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]}
  cv.onpointerdown=function(e){down=true;var p=pt(e);lx=p[0];ly=p[1];try{cv.setPointerCapture(e.pointerId)}catch(x){}g.beginPath();g.arc(lx,ly,1.2,0,6.283);g.fill();cv._dirty=true;e.preventDefault()};
  cv.onpointermove=function(e){if(!down)return;var p=pt(e);g.beginPath();g.moveTo(lx,ly);g.lineTo(p[0],p[1]);g.stroke();lx=p[0];ly=p[1];e.preventDefault()};
  cv.onpointerup=cv.onpointercancel=function(){down=false};
}

    tbl({head:[['Point','Commentaire']],body:[['Ponctualité et assiduité',c(TT.ponct)],['Comportement et sérieux',c(TT.compo)],['Qualité du travail',c(TT.qualite)],['Appréciation générale',c(TT.gen)]],bodyStyles:{minCellHeight:16},columnStyles:{0:{cellWidth:56,fontStyle:'bold'}}});
    h2('Signatures');room(50);
    var sgs=[['eleve','Élève'],['tuteur','Tuteur'],['patron','Patron'],['prof','Professeur référent']],bw=(PW-2*M-12)/4;
    doc.setTextColor(INK[0],INK[1],INK[2]);doc.setDrawColor(150,160,157);doc.setLineWidth(0.2);
    sgs.forEach(function(o,k){
      var x=M+k*(bw+4),g=(S.sig&&S.sig[o[0]])||{};
      doc.rect(x,y,bw,44);doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.text(c(o[1]),x+2,y+5);
      doc.setFont('helvetica','normal');doc.setFontSize(7.5);
      if(g.img){
        var iw=bw-4,ih2=g.w&&g.h?Math.min(24,iw*g.h/g.w):20,iw2=g.w&&g.h?Math.min(iw,24*g.w/g.h):iw;
        try{doc.addImage(g.img,'PNG',x+2,y+8,iw2,ih2)}catch(e){}
        doc.text(doc.splitTextToSize(c(g.nom||''),bw-4),x+2,y+35);
        doc.text(c('Signé le '+sdate(g.date)),x+2,y+41);
      }else doc.text('Date et signature :',x+2,y+10);
    });
    y+=48;
    var pages=doc.getNumberOfPages();
    for(i=1;i<=pages;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(110,120,117);doc.text(c('Livret PFMP - '+(I.nom||'')+' - page '+i+'/'+pages),M,PH-6)}
    return doc.output('blob');
  });
}
/*PDF-END*/
function vPdf(){
  var f=filledDays(),tot=weeksCount()*5;
  return '<section class="card noprint"><h2>Mon livret en PDF</h2><p class="lead">'+f+' journée'+(f>1?'s':'')+' remplie'+(f>1?'s':'')+' sur '+tot+'. Le PDF reprend tout le livret, avec les cases vides pour la signature et l\'avis du tuteur.</p>'
   +pdfButtons()
   +'<details><summary>Texte à copier</summary><textarea readonly id="plainTxt" style="width:100%;min-height:140px;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)">'+esc(plain())+'</textarea></details></section>'
   +'<section class="card">'+sheet()+'</section>';
}

/* ---------- rendu ---------- */
function route(){var r=(location.hash||'').slice(1);if(ROUTES.indexOf(r)<0)r=S.info.nom?'journee':'infos';return r}
function tape(){
  var f=filledDays(),tot=weeksCount()*5,p=Math.min(100,Math.round(f/tot*100));
  document.getElementById('tapeFill').style.width=p+'%';
  document.getElementById('tapeTxt').textContent=f+' jour'+(f>1?'s':'')+' sur '+tot;
  document.getElementById('who').textContent=S.info.nom||'';
}
function render(keepScroll){
  var y=window.scrollY,r=route(),v=document.getElementById('view');
  v.innerHTML=({infos:vInfos,journee:vJournee,photos:vPhotos,bilans:vBilans,pdf:vPdf})[r]();
  Array.prototype.forEach.call(document.querySelectorAll('.nav a'),function(a){if(a.getAttribute('data-r')===r)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  tape();
  initPads();
  window.scrollTo(0,keepScroll?y:0);
}

/* ---------- photos ---------- */
function shrink(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var m=900,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res({data:c.toDataURL('image/jpeg',0.6),w:c.width,h:c.height})};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function addPhotos(files){
  var onDay=route()==='journee',date=onDay&&draft?draft.date:todayISO(),list=Array.prototype.slice.call(files);
  toast('Photo en cours d\'ajout…');
  list.reduce(function(chain,f){return chain.then(function(){return shrink(f).then(function(r){var p={id:uid(),date:date,legende:'',data:r.data,w:r.w,h:r.h};S.photos.push(p);if(onDay&&draft)draft.photos.push(p.id)})})},Promise.resolve())
    .then(function(){save();render(true);toast('Photo ajoutée')})
    .catch(function(){toast('Cette photo n\'a pas pu être lue. Essaie-en une autre.')});
}

/* ---------- événements ---------- */
document.addEventListener('input',function(e){
  var el=e.target,p=el.getAttribute&&el.getAttribute('data-p');if(!p)return;
  if(p==='draft.date')return;
  set(p,el.value);if(p.indexOf('draft.')!==0)saveSoon();
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.hasAttribute&&el.hasAttribute('data-photo')){if(el.files&&el.files.length)addPhotos(el.files);el.value='';return}
  if(el.getAttribute&&el.getAttribute('data-p')==='draft.date'&&el.value){draft=draftFor(el.value);render(true)}
});
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-radio],[data-chip],[data-act]');if(!b)return;
  var p,v;
  if(b.hasAttribute('data-radio')){
    p=b.getAttribute('data-radio');v=b.getAttribute('data-v');
    var nv=get(p)===v?'':v;set(p,nv);
    Array.prototype.forEach.call(b.parentNode.children,function(s){s.setAttribute('aria-pressed',String(nv!==''&&s.getAttribute('data-v')===nv))});
    if(p.indexOf('draft.')!==0)saveSoon();return;
  }
  if(b.hasAttribute('data-chip')){
    p=b.getAttribute('data-chip');v=b.getAttribute('data-v');
    var arr=get(p)||[],i=arr.indexOf(v);if(i>-1)arr.splice(i,1);else arr.push(v);set(p,arr);
    b.setAttribute('aria-pressed',String(i<0));return;
  }
  var a=b.getAttribute('data-act'),id=b.getAttribute('data-id');
  if(a==='wk'){wk=+b.getAttribute('data-v');render(true)}
  else if(a==='mode'){mode=b.getAttribute('data-v');render()}
  else if(a==='save-day'){
    if(!draft.date){toast('Choisis la date.');return}
    if(!draft.acts.length&&!draft.text){toast('Touche au moins une activité ou écris une phrase.');return}
    if(!draft.level){toast('Coche ton niveau : autonome, avec aide ou observé.');return}
    var cp=JSON.parse(JSON.stringify(draft)),found=false;
    S.days=S.days.map(function(d){if(d.id===cp.id){found=true;return cp}return d});
    if(!found)S.days.push(cp);
    if(save())toast('Journée enregistrée');
    render(true);
  }
  else if(a==='edit-day'){draft=draftFor(id);location.hash='#journee';render()}
  else if(a==='del-day'||a==='del-photo'){
    if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Confirmer la suppression';setTimeout(function(){if(b.isConnected){b.classList.remove('armed');b.textContent='Supprimer'}},4000);return}
    if(a==='del-day'){S.days=S.days.filter(function(d){return d.id!==id});if(draft&&draft.id===id)draft=null}
    else{S.photos=S.photos.filter(function(p){return p.id!==id});S.days.forEach(function(d){d.photos=(d.photos||[]).filter(function(x){return x!==id})});if(draft)draft.photos=draft.photos.filter(function(x){return x!==id})}
    save();render(true);
  }
  else if(a==='sig-clear'){
    var who0=b.getAttribute('data-who'),c0=document.querySelector('canvas.pad[data-pad="'+who0+'"]');
    if(c0)initPad(c0);
  }
  else if(a==='sig-ok'){
    var who1=b.getAttribute('data-who'),c1=document.querySelector('canvas.pad[data-pad="'+who1+'"]');
    if(!c1||!c1._dirty){toast('Signe d\'abord avec le doigt dans le cadre.');return}
    var k1=Math.min(1,600/c1.width),o1=document.createElement('canvas');
    o1.width=Math.round(c1.width*k1);o1.height=Math.round(c1.height*k1);
    var g1=o1.getContext('2d');g1.fillStyle='#FFFFFF';g1.fillRect(0,0,o1.width,o1.height);g1.drawImage(c1,0,0,o1.width,o1.height);
    S.sig=S.sig||{};var cur=S.sig[who1]||{};
    cur.img=o1.toDataURL('image/png');cur.w=o1.width;cur.h=o1.height;cur.date=todayISO();S.sig[who1]=cur;
    if(save())toast('Signature enregistrée');
    render(true);
  }
  else if(a==='sig-redo'){
    var who2=b.getAttribute('data-who');
    if(S.sig&&S.sig[who2]){delete S.sig[who2].img;delete S.sig[who2].w;delete S.sig[who2].h;delete S.sig[who2].date}
    save();render(true);
  }
  else if(a==='pdf-make'){
    if(pdfBusy)return;
    pdfBusy=true;b.disabled=true;b.textContent='Création en cours…';
    buildPdf().then(function(bl){pdfBlob=bl;pdfBusy=false;render(true);toast('PDF prêt')})
      .catch(function(err){pdfBusy=false;render(true);toast(err&&err.message==='nolib'?'Il faut une connexion internet pour créer le PDF. Connecte-toi puis réessaie.':'Le PDF n\'a pas pu être créé. Copie le texte à la place.')});
  }
  else if(a==='pdf-share'){
    if(!pdfBlob)return;
    var fl=null;try{fl=new File([pdfBlob],pdfFileName(),{type:'application/pdf'})}catch(err){}
    if(fl&&navigator.canShare&&navigator.canShare({files:[fl]})){
      navigator.share({files:[fl],title:'Livret PFMP'}).catch(function(err){if(err&&err.name!=='AbortError')toast('Le partage a échoué. Essaie « Télécharger ».')});
    }else toast('Le partage n\'est pas disponible ici. Utilise « Télécharger ».');
  }
  else if(a==='pdf-dl'){
    if(!pdfBlob)return;
    var u=URL.createObjectURL(pdfBlob),ln=document.createElement('a');
    ln.href=u;ln.download=pdfFileName();document.body.appendChild(ln);ln.click();ln.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},60000);
  }
  else if(a==='copy'){
    var t=plain(),box=document.getElementById('plainTxt');
    function fb(){box.closest('details').open=true;box.focus();box.select();toast('Texte sélectionné : copie-le avec ton clavier.')}
    try{navigator.clipboard.writeText(t).then(function(){toast('Texte copié')},fb)}catch(err){fb()}
  }
});
window.addEventListener('hashchange',function(){render()});

load();
if(!draft)draft=draftFor(todayISO());
render();
})();
</script>
